[project]
site_name = "kuroi"
site_description = "Strip sensitive data from PDFs with LLM assistance."
site_url = "https://icij.github.io/kuroi/"
repo_url = "https://github.com/ICIJ/kuroi"
repo_name = "ICIJ/kuroi"
edit_uri = "edit/main/docs"
docs_dir = "docs"
dev_addr = "0.0.0.0:4000"
copyright = "Copyright &copy; International Consortium of Investigative Journalists"
exclude_docs = "superpowers/"

extra_css = ["stylesheets/extra.css"]

# Navigation tree
nav = [
  { Home = "index.md" },
  { "User Guide" = [
    { Install = "user-guide/install.md" },
    { "Quick start" = "user-guide/quickstart.md" },
    { "Batch redaction" = "user-guide/batch.md" },
    { "LLM providers" = "user-guide/providers.md" },
    { "Prompt tuning" = "user-guide/prompt-tuning.md" },
    { "Audit, diff, undo & backups" = "user-guide/audit-and-undo.md" },
    { Troubleshooting = "user-guide/troubleshooting.md" },
  ]},
  { "Developer Guide" = [
    { Architecture = "developer-guide/architecture.md" },
    { Contributing = "developer-guide/contributing.md" },
    { "Using kuroi as a library" = "developer-guide/library-usage.md" },
    { "Adding an LLM provider" = "developer-guide/adding-a-provider.md" },
    { "Writing rule packs" = "developer-guide/writing-rule-packs.md" },
  ]},
  { Reference = [
    { CLI = "reference/cli.md" },
    { "Python API" = [
      { "kuroi.core.redaction" = "reference/api/redaction.md" },
      { "kuroi.core.findings" = "reference/api/findings.md" },
      { "kuroi.core.rules" = "reference/api/rules.md" },
      { "kuroi.providers.base" = "reference/api/providers.md" },
    ]},
    { "Rule schema" = "reference/rule-schema.md" },
    { Configuration = "reference/config.md" },
    { "Exit codes" = "reference/exit-codes.md" },
  ]},
  { About = [
    { Changelog = "about/changelog.md" },
    { License = "about/license.md" },
  ]},
]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ICIJ/kuroi"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/kuroi/"

# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
[project.theme]
language = "en"
favicon = "assets/favicon.svg"
features = [
  "announce.dismiss",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.indexes",
  "navigation.top",
  "navigation.footer",
  "toc.follow",
  "search.suggest",
  "search.highlight",
  "search.share",
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
]

[project.theme.font]
text = "Poppins"
code = "Noto Sans Mono"

[[project.theme.palette]]
scheme = "slate"
primary = "black"
accent = "red"

# ---------------------------------------------------------------------------
# Markdown extensions
# ---------------------------------------------------------------------------
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]

[project.markdown_extensions.pymdownx.superfences]
# format value is resolved from the string by Zensical (no !!python/name: tag needed)
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.snippets]
base_path = ["docs/_snippets", "."]
check_paths = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------
[project.plugins.search]

[project.plugins.mkdocstrings]
handlers.python.paths = ["src"]
handlers.python.options.docstring_style = "google"
handlers.python.options.show_source = false
handlers.python.options.show_root_heading = true
handlers.python.options.show_root_full_path = false
handlers.python.options.members_order = "source"
handlers.python.options.separate_signature = true
handlers.python.options.show_signature_annotations = true
handlers.python.options.heading_level = 2
