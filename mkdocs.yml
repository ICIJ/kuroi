site_name: kuroi
site_description: Strip sensitive data from PDFs with LLM assistance.
site_url: https://icij.github.io/kuroi/
repo_url: https://github.com/ICIJ/kuroi
repo_name: ICIJ/kuroi
edit_uri: edit/main/docs/
docs_dir: docs
dev_addr: 0.0.0.0:4000
copyright: Copyright &copy; International Consortium of Investigative Journalists

exclude_docs: |
  superpowers/

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    scheme: slate
    primary: black
    accent: red
  font:
    text: Poppins
    code: Noto Sans Mono
  features:
    - announce.dismiss
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ICIJ/kuroi
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/kuroi/

nav:
  - Home: index.md
  - User Guide:
      - Install: user-guide/install.md
      - Quick start: user-guide/quickstart.md
      - Batch redaction: user-guide/batch.md
      - LLM providers: user-guide/providers.md
      - Audit, diff, undo & backups: user-guide/audit-and-undo.md
      - Troubleshooting: user-guide/troubleshooting.md
  - Developer Guide:
      - Architecture: developer-guide/architecture.md
      - Contributing: developer-guide/contributing.md
      - Using kuroi as a library: developer-guide/library-usage.md
      - Adding an LLM provider: developer-guide/adding-a-provider.md
      - Writing rule packs: developer-guide/writing-rule-packs.md
  - Reference:
      - CLI: reference/cli.md
      - Python API:
          - kuroi.core.redaction: reference/api/redaction.md
          - kuroi.core.findings: reference/api/findings.md
          - kuroi.core.rules: reference/api/rules.md
          - kuroi.providers.base: reference/api/providers.md
      - Rule schema: reference/rule-schema.md
      - Configuration: reference/config.md
      - Exit codes: reference/exit-codes.md
  - About:
      - Changelog: about/changelog.md
      - License: about/license.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path:
        - docs/_snippets
        - .
      check_paths: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys

hooks:
  - docs/_scripts/hooks.py

plugins:
  - search
  - mkdocs-typer2
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            heading_level: 2
  - gen-files:
      scripts:
        - docs/_scripts/gen_rule_schema.py
