site_name: kuroi
site_description: Strip sensitive data from PDFs with LLM assistance.
site_url: https://icij.github.io/kuroi/
repo_url: https://github.com/ICIJ/kuroi
repo_name: ICIJ/kuroi
edit_uri: edit/main/docs/
docs_dir: docs

exclude_docs: |
  superpowers/

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    scheme: slate
    primary: black
    accent: red
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
