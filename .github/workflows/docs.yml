name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: ['*']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync env with docs extras
        run: uv sync --extra docs

      - name: Regenerate auto-derived reference pages
        run: make docs-gen

      - name: Drift check (regenerated pages must match committed)
        run: |
          if ! git diff --exit-code docs/reference/cli.md docs/reference/rule-schema.md; then
            echo "::error::Generated reference pages are out of date."
            echo "Run 'make docs-gen' locally and commit the updated files."
            exit 1
          fi

      - name: Build docs
        run: uv run zensical build

      - name: Strip leaked source dirs
        run: rm -rf site/superpowers site/_scripts site/_snippets

      - name: Upload site artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
